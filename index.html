.meta{color:var(--mut);font-size:14px}.meta b{color:var(--gold2)}

.grid{display:grid;grid-template-columns:1fr 250px;gap:18px}

.qn{color:var(--gold);font-weight:700;font-size:14px;margin-bottom:6px}
.q{font-size:20px;font-weight:700;margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:var(--white);margin-bottom:10px;padding:14px 16px;font-weight:500}

.pal h4{font-size:14px;color:var(--mut);margin-bottom:10px}

.cell{padding:8px 0;border-radius:10px;background:rgba(255,255,255,.07);color:var(--mut);font-size:14px;font-weight:700}

.cell.cur{outline:2px solid #fff}
.legend{margin-top:12px;font-size:12px;color:var(--mut)}
.score{text-align:center}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;font-size:34px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}

</head>

const $=s=>document.querySelector(s),L=["A","B","C","D"];
let S=JSON.parse(localStorage.getItem("hu_state")||"null"),tm;
const save=()=>localStorage.setItem("hu_state",JSON.stringify(S));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>["login","exam","result"].forEach(x=>$("#"+x).classList.toggle("hide",x!=id));
$("#iTitle").textContent=CFG.EXAM_TITLE;$("#iCnt").textContent=QUESTIONS.length+" ta savol";$("#iMin").textContent=CFG.MINUTES+" daqiqa";
$("#eTitle").textContent=CFG.EXAM_TITLE;$("#tot").textContent=QUESTIONS.length;

function begin(){
  const f=$("#fn").value.trim(),l=$("#ln").value.trim();
  if(f.length<2||l.length<2){$("#err").textContent="Ism va familiyani to‘liq kiriting";return}
  const idx=QUESTIONS.map((_,i)=>i);if(CFG.SHUFFLE_Q)shuffle(idx);
  S={name:f+" "+l,start:Date.now(),end:Date.now()+CFG.MINUTES*60000,cur:0,ans:{},done:false,
     order:idx.map(i=>({i,o:CFG.SHUFFLE_O?shuffle([0,1,2,3]):[0,1,2,3]}))};
  save();runExam();
}
function runExam(){
  show("exam");$("#who").innerHTML="👤 "+esc(S.name)+" · <b>@huququstoz</b>";
  const c=$("#cells");c.innerHTML="";
  S.order.forEach((_,p)=>{const b=document.createElement("button");b.className="cell";b.textContent=p+1;b.onclick=()=>{S.cur=p;save();draw()};c.appendChild(b)});
  draw();tick();clearInterval(tm);tm=setInterval(tick,500);
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function draw(){
  const p=S.cur,it=S.order[p],Q=QUESTIONS[it.i],n=S.order.length;
  $("#qn").textContent=`Savol ${p+1} / ${n}`;$("#q").textContent=Q.q;
  $("#opts").innerHTML=it.o.map((oi,k)=>`<button class="opt ${S.ans[p]===oi?"sel":""}" onclick="pick(${oi})"><span class="l">${L[k]}</span>${esc(Q.o[oi])}</button>`).join("");
  $("#prev").disabled=p==0;$("#next").disabled=p==n-1;
  const done=Object.keys(S.ans).length;$("#cnt").textContent=done;$("#bar").style.width=done/n*100+"%";
  [...$("#cells").children].forEach((b,i)=>{b.classList.toggle("done",S.ans[i]!==undefined);b.classList.toggle("cur",i==p)});
}
function pick(oi){S.ans[S.cur]=oi;save();draw()}
function go(d){S.cur+=d;save();draw()}
function tick(){
  const left=Math.max(0,S.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
  const t=$("#timer");t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("low",left<5*60000);
  if(left==0){clearInterval(tm);finish(true)}
}
function finish(auto){
  if(!auto){
    const un=S.order.length-Object.keys(S.ans).length;
    if(!confirm(un?`${un} ta savolga javob berilmagan. Yakunlaysizmi?`:"Testni yakunlaysizmi?"))return;
  }
  clearInterval(tm);
  let ok=0;S.order.forEach((it,p)=>{if(S.ans[p]===QUESTIONS[it.i].a)ok++});
  const total=S.order.length,ans=Object.keys(S.ans).length;
  S.res={name:S.name,exam:CFG.EXAM_TITLE,total,answered:ans,correct:ok,wrong:ans-ok,percent:Math.round(ok/total*1000)/10,
         seconds:Math.round((Math.min(Date.now(),S.end)-S.start)/1000)};
  S.done=true;S.sent=false;save();showResult();send();
}
function showResult(){
  show("result");const r=S.res,un=r.total-r.answered;
  let rev="";
  S.order.forEach((it,p)=>{const Q=QUESTIONS[it.i];if(S.ans[p]===Q.a)return;
    rev+=`<div class="rev"><b>${esc(Q.q)}</b><br>${S.ans[p]===undefined?'<span class="r">Javob berilmagan</span>':'<span class="r">Sizning javob: '+esc(Q.o[S.ans[p]])+'</span>'}<br><span class="g">To‘g‘ri javob: ${esc(Q.o[Q.a])}</span><br><small>${esc(Q.e||"")}</small></div>`});
  $("#result").innerHTML=`<div class="logo">Huquq<b>Ustoz</b></div><p class="tag">${esc(r.name)} · ${esc(r.exam)}</p>
  <div class="ring" style="background:conic-gradient(var(--gold) ${r.percent*3.6}deg,rgba(255,255,255,.1) 0)"><div style="background:var(--navy2);width:122px;height:122px;border-radius:50%;display:grid;place-items:center">${r.percent}%</div></div>
  <h2>Natijangiz: ${r.correct}/${r.total} — ${r.percent}%</h2>
  <div class="stats"><div class="stat"><b>${r.answered}</b>yechilgan</div><div class="stat"><b class="g">${r.correct}</b>to‘g‘ri</div><div class="stat"><b class="r">${r.wrong}</b>noto‘g‘ri</div><div class="stat"><b>${un}</b>javobsiz</div><div class="stat"><b>${Math.floor(r.seconds/60)} daq</b>sarflandi</div></div>
  <p id="sent"></p><button class="ghost hide" id="retry" onclick="send()">Qayta yuborish</button>
  <h3 style="margin:22px 0 12px;text-align:left">Xato va javobsiz savollar</h3>${rev||'<p class="g">Barcha javoblar to‘g‘ri! 🎉</p>'}
  <button class="btn" style="margin-top:14px" onclick="localStorage.removeItem('hu_state');location.reload()">Yangi urinish</button>`;
  setSent();
}
function setSent(){const e=$("#sent");if(!e)return;e.textContent=S.sent?"✅ Natija o‘qituvchiga yuborildi":"⏳ Natija yuborilmoqda...";$("#retry").classList.add("hide")}
const call=(m,b)=>fetch(`https://api.telegram.org/bot${CFG.BOT_TOKEN}/${m}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
async function send(){
  if(S.sent)return;const r=S.res;
  try{
    const a=await call("sendMessage",{chat_id:CFG.CHAT_ID,text:`📝 ${r.exam} natijalari\n\n👤 ${r.name}\n📋 Yechgan: ${r.answered}/${r.total}\n✅ To‘g‘ri: ${r.correct}\n❌ Noto‘g‘ri: ${r.wrong}\n⬜ Javobsiz: ${r.total-r.answered}\n📊 Natija: ${r.percent}%\n⏱ Vaqt: ${Math.floor(r.seconds/60)} daq ${r.seconds%60} son`});
    if(!a.ok)throw 0;S.sent=true;save();setSent();
  }catch(e){$("#sent").textContent="⚠️ Yuborib bo‘lmadi. Internetni tekshiring.";$("#retry").classList.remove("hide");return}
  summary(r);
}
async function summary(r){
  const id=CFG.CHAT_ID;
  try{
    const pm=((await call("getChat",{chat_id:id})).result||{}).pinned_message;
    const rows={};let mid=null;
    if(pm&&pm.text&&pm.text.startsWith("📊")){mid=pm.message_id;
      pm.text.split("\n").forEach(l=>{const m=l.match(/^\d+\.\s+(.+?)\s+—\s+(\d+)\/(\d+)\s+—\s+([\d.]+)%$/);if(m)rows[m[1].toLowerCase()]={name:m[1],correct:+m[2],total:+m[3],percent:+m[4]}})}
    rows[r.name.toLowerCase()]={name:r.name,correct:r.correct,total:r.total,percent:r.percent};
    const list=Object.values(rows).sort((a,b)=>b.correct-a.correct);
    const text=`📊 ${r.exam} — umumiy jadval (${list.length} ta o‘quvchi)\n\n`+list.slice(0,90).map((x,i)=>`${i+1}. ${x.name} — ${x.correct}/${x.total} — ${x.percent}%`).join("\n");
    let ok=false;
    if(mid)ok=(await call("editMessageText",{chat_id:id,message_id:mid,text})).ok;
    if(!ok){const s=await call("sendMessage",{chat_id:id,text});if(s.ok)await call("pinChatMessage",{chat_id:id,message_id:s.result.message_id,disable_notification:true})}
  }catch(e){}
}
if(S&&S.done)showResult();else if(S)runExam();else show("login");
</script>
